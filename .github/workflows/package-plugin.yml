name: Package Plugin

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate plugin metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          marketplace = json.loads(Path(".agents/plugins/marketplace.json").read_text())
          expected_plugins = {
              "build-visionos-apps": {"mcp": True},
              "build-realitykit": {"mcp": False},
              "build-reality-composer-pro-3": {"mcp": False},
          }

          entries = {
              entry.get("name"): entry
              for entry in marketplace.get("plugins", [])
          }

          for plugin_name, options in expected_plugins.items():
              plugin_root = Path("plugins") / plugin_name
              manifest = json.loads((plugin_root / ".codex-plugin/plugin.json").read_text())

              assert manifest["name"] == plugin_name
              assert manifest["skills"] == "./skills/"
              assert (plugin_root / "assets/icon.png").is_file()
              assert (plugin_root / "skills").is_dir()
              assert any((plugin_root / "skills").iterdir())

              if options["mcp"]:
                  assert manifest["mcpServers"] == "./.mcp.json"
                  assert (plugin_root / ".mcp.json").is_file()
                  mcp = json.loads((plugin_root / ".mcp.json").read_text())
                  assert mcp["mcpServers"]["XcodeBuildMCP"]["command"] == "npx"
                  assert mcp["mcpServers"]["xcode"] == {
                      "command": "xcrun",
                      "args": ["mcpbridge"],
                  }
              else:
                  assert "mcpServers" not in manifest

              entry = entries.get(plugin_name)
              assert entry is not None
              assert entry["source"] == {
                  "source": "local",
                  "path": f"./plugins/{plugin_name}",
              }
              assert entry["policy"]["installation"] == "AVAILABLE"
              assert entry["policy"]["authentication"] == "ON_INSTALL"
              assert entry["category"] == "Coding"
          PY

      - name: Build plugin zips
        run: |
          mkdir -p dist
          cd plugins
          for plugin in build-visionos-apps build-realitykit build-reality-composer-pro-3; do
            zip -r "../dist/${plugin}.zip" "$plugin" \
              -x '*/.DS_Store' \
                 '*/__pycache__/*' \
                 '*/.gitkeep'
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-meije-spatial-plugins
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach zip to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
